name: Gyeot
options:
  bundleIdPrefix: com.sehwan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gyeot:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    entitlements:
      path: App/Gyeot.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sehwan.gyeot
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 곁
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehwan.gyeot
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: GyeotWidget
        embed: true
        codeSign: true
  GyeotWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Widget/GyeotWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sehwan.gyeot
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 곁
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sehwan.gyeot.widget
        TARGETED_DEVICE_FAMILY: "1"
